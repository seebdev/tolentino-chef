services:
  - type: web
    name: tolentino-restaurantes-admin
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run typecheck && npm run lint && npm run test && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22.23.3
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: PLATFORM_HOSTNAMES
        sync: false
      - key: RENDER_SERVICE_HOSTNAME
        sync: false
